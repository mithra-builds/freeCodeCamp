<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <ul class="todo-list">
      <li>
        <input type="checkbox" id="C1">
        <label for="C1">Follow</label>
        <ul class="sub-item">
         <li><a href="https://google.com" target="_blank" class="sub-item-link">Gryffindor</a></li>
        </ul>
      </li>
      <li>
        <input type="checkbox" id="C2">
        <label for="C2">View</label>
        <ul class="sub-item">
         <li><a href="https://mit.edu" target="_blank" class="sub-item-link">Slytherin</a></li>
        </ul>
      </li>
      <li>
        <input type="checkbox" id="C3">
        <label for="C3">Support</label>
        <ul class="sub-item">
         <li><a href="https://nasa.gov" target="_blank" class="sub-item-link">Hufflepuff</a></li>
        </ul>
      </li>
      <li>
        <input type="checkbox" id="C4">
        <label for="C4">Instruct</label>
        <ul class="sub-item">
         <li><a href="https://wikipedia.org" target="_blank"class="sub-item-link">Ravenclaw</a></li>
        </ul>
      </li>
    </ul>


</body>

</html>
